<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cron 表达式解析工具</title>
    <link rel="stylesheet" href="nav.css">
    <script src="nav.js" defer></script>
    <script src="changelog.js"></script>
    <script src="clipboard-utils.js"></script>
    <script src="sample-data.js"></script>
    <script src="cron-parser.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --panel-bg: #ffffff;
            --border-color: #d0d7de;
            --text-color: #24292f;
            --muted-color: #57606a;
            --accent-color: #0969da;
            --danger-color: #cf222e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 18px;
            min-height: 100vh;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        .container {
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
        }

        .tool-title,
        .panel-header,
        .input-row,
        .actions,
        .result-header {
            display: flex;
            align-items: center;
        }

        .tool-title {
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .version-info {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background: #f6f8fa;
            color: var(--muted-color);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }

        .panel {
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--panel-bg);
            box-shadow: 0 1px 3px rgba(27, 31, 36, 0.06);
        }

        .panel + .panel {
            margin-top: 16px;
        }

        .panel-header,
        .result-header {
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .panel-header h2,
        .result-header h2 {
            margin: 0;
            font-size: 16px;
        }

        .input-row {
            gap: 10px;
            flex-wrap: wrap;
        }

        input {
            padding: 9px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            background: #fff;
        }

        #cron-input {
            flex: 1;
            min-width: 280px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }

        #count-input {
            width: 110px;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(9, 105, 218, 0.2);
        }

        .actions {
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 13px;
            border: 1px solid rgba(27, 31, 36, 0.15);
            border-radius: 6px;
            background: #fff;
            color: var(--text-color);
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            border-color: var(--accent-color);
            background: var(--accent-color);
            color: #fff;
        }

        .status {
            margin-top: 10px;
            padding: 8px 10px;
            border-radius: 6px;
            background: #f6f8fa;
            color: var(--muted-color);
            font-size: 13px;
        }

        .status.error {
            background: #ffebe9;
            color: var(--danger-color);
        }

        .cron-explanation {
            margin-top: 12px;
            padding: 12px 14px;
            border-left: 3px solid var(--accent-color);
            border-radius: 6px;
            background: #f0f7ff;
            line-height: 1.6;
        }

        .cron-explanation strong {
            display: block;
            margin-bottom: 3px;
            font-size: 13px;
            color: var(--muted-color);
        }

        .result-list {
            display: grid;
            gap: 8px;
        }

        .run-item {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 7px;
            background: #f6f8fa;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 13px;
        }

        .hint {
            color: var(--muted-color);
            font-size: 13px;
            line-height: 1.6;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            width: min(650px, calc(100vw - 32px));
            max-height: 85vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            background: #fff;
        }

        .modal-header {
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eaeef2;
            background: #f6f8fa;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 18px;
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            line-height: 1.6;
        }

        .close-modal {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--muted-color);
            cursor: pointer;
            font-size: 20px;
        }

        .changelog-date {
            display: inline-block;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--accent-color);
            font-size: 16px;
            font-weight: 700;
        }

        .changelog-entry {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .changelog-version {
            flex: 0 0 56px;
            color: var(--accent-color);
            font-weight: 700;
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="tool-title">
            <h1>Cron 表达式解析工具</h1>
            <div class="version-info" onclick="showChangelog()" title="查看版本更新记录">
                <span>V1.01</span>
                <span>ℹ️</span>
            </div>
        </div>

        <section class="panel">
            <div class="panel-header">
                <h2>表达式</h2>
            </div>
            <div class="input-row">
                <input id="cron-input" placeholder="例如 */30 * * * * 或 0 0 12 * * ?">
                <input id="count-input" type="number" min="1" max="50" value="10" title="输出次数">
            </div>
            <div class="actions">
                <button class="btn btn-primary" id="parse-btn" type="button">解析</button>
                <button class="btn" id="sample-linux-btn" type="button">Linux 示例</button>
                <button class="btn" id="sample-quartz-btn" type="button">Quartz 示例</button>
            </div>
            <div class="status" id="parse-status">支持 5 段 Linux cron 和 6/7 段 Quartz cron。复杂 L/W/# 语法暂不处理。</div>
            <div class="cron-explanation" id="cron-explanation">
                <strong>执行说明</strong>
                <span>解析后将在这里说明表达式的执行时间。</span>
            </div>
        </section>

        <section class="panel">
            <div class="result-header">
                <h2>最近执行时间</h2>
                <button class="btn" id="copy-result-btn" type="button">复制结果</button>
            </div>
            <div class="result-list" id="result-list">
                <div class="hint">点击解析后显示最近 N 次执行时间。</div>
            </div>
        </section>
    </main>

    <div id="changelog-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🚀 版本更新说明</h3>
                <button class="close-modal" type="button" onclick="closeChangelog()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="changelog-date">2026年7月13日</div>
                <div class="changelog-entry">
                    <div class="changelog-version">V1.01</div>
                    <div>新增执行说明：使用自然语言解释 Cron 表达式在什么时候执行。</div>
                </div>
                <div class="changelog-date">2026年7月11日</div>
                <div class="changelog-entry">
                    <div class="changelog-version">V1.00</div>
                    <div>版本初始化：支持解析 5 段 Linux cron 和 6/7 段 Quartz cron，展示最近执行时间，并在字段错误时给出提示。</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const cronInput = document.getElementById('cron-input');
        const countInput = document.getElementById('count-input');
        const parseStatus = document.getElementById('parse-status');
        const cronExplanation = document.getElementById('cron-explanation');
        const resultList = document.getElementById('result-list');
        let currentRuns = [];

        function renderRuns(runs) {
            currentRuns = runs;
            resultList.innerHTML = runs.map((date, index) => `
                <div class="run-item">#${index + 1} ${date.toLocaleString()} (${date.toISOString()})</div>
            `).join('');
        }

        function parseCron() {
            try {
                const info = CronParser.detectCronType(cronInput.value);
                const runs = CronParser.getNextRuns(cronInput.value, { count: Number(countInput.value) || 10 });
                const explanation = CronParser.explainCron(cronInput.value);
                parseStatus.textContent = `解析成功：${info.type === 'linux' ? 'Linux 5 段' : `Quartz ${info.fields} 段`} 表达式`;
                parseStatus.className = 'status';
                cronExplanation.innerHTML = `<strong>执行说明</strong><span>${explanation}</span>`;
                renderRuns(runs);
            } catch (error) {
                parseStatus.textContent = `解析失败：${error.message}`;
                parseStatus.className = 'status error';
                cronExplanation.innerHTML = '<strong>执行说明</strong><span>表达式无效，修正后可查看执行时间说明。</span>';
            }
        }

        document.getElementById('parse-btn').addEventListener('click', parseCron);
        document.getElementById('sample-linux-btn').addEventListener('click', () => {
            cronInput.value = SampleData.getSample('cron.linuxEveryThirtyMinutes');
            parseCron();
        });
        document.getElementById('sample-quartz-btn').addEventListener('click', () => {
            cronInput.value = SampleData.getSample('cron.quartzDailyNoon');
            parseCron();
        });
        document.getElementById('copy-result-btn').addEventListener('click', () => {
            if (!currentRuns.length) {
                ClipboardUtils.showToast('暂无执行时间');
                return;
            }
            ClipboardUtils.copyText(currentRuns.map((date) => date.toISOString()).join('\n'), { successMessage: '执行时间已复制' });
        });
        cronInput.value = SampleData.getSample('cron.linuxEveryThirtyMinutes');
        parseCron();
    </script>
</body>

</html>
