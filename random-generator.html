<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UUID / 随机值生成器</title>
    <link rel="stylesheet" href="nav.css">
    <script src="nav.js" defer></script>
    <script src="changelog.js"></script>
    <script src="clipboard-utils.js"></script>
    <script src="random-generator.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --panel-bg: #ffffff;
            --border-color: #d0d7de;
            --text-color: #24292f;
            --muted-color: #57606a;
            --accent-color: #0969da;
            --danger-color: #cf222e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 18px;
            min-height: 100vh;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        button,
        input,
        select {
            font: inherit;
        }

        .container {
            width: 100%;
            max-width: 1120px;
            margin: 0 auto;
        }

        .tool-title,
        .panel-header,
        .form-grid,
        .checks,
        .actions,
        .result-header {
            display: flex;
            align-items: center;
        }

        .tool-title {
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .version-info {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background: #f6f8fa;
            color: var(--muted-color);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }

        .version-info:hover {
            color: var(--accent-color);
            border-color: var(--accent-color);
            background: #ddf4ff;
        }

        .workspace {
            display: grid;
            grid-template-columns: minmax(320px, 0.75fr) minmax(460px, 1.25fr);
            gap: 16px;
        }

        .panel {
            min-width: 0;
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--panel-bg);
            box-shadow: 0 1px 3px rgba(27, 31, 36, 0.06);
        }

        .panel-header,
        .result-header {
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .panel-header h2 {
            margin: 0;
            font-size: 16px;
        }

        .form-grid {
            align-items: stretch;
            flex-direction: column;
            gap: 12px;
        }

        .form-grid label {
            display: grid;
            gap: 5px;
            color: var(--muted-color);
            font-size: 13px;
            font-weight: 600;
        }

        .form-grid input,
        .form-grid select {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            background: #fff;
        }

        .form-grid input:focus,
        .form-grid select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(9, 105, 218, 0.2);
        }

        .checks {
            gap: 10px;
            flex-wrap: wrap;
        }

        .checks label {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .checks input {
            width: auto;
        }

        .actions {
            justify-content: center;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 13px;
            border: 1px solid rgba(27, 31, 36, 0.15);
            border-radius: 6px;
            background: #fff;
            color: var(--text-color);
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover {
            background: #f3f4f6;
        }

        .btn-primary {
            border-color: var(--accent-color);
            background: var(--accent-color);
            color: #fff;
        }

        .btn-danger {
            border-color: var(--danger-color);
            color: var(--danger-color);
        }

        .result-list {
            display: grid;
            gap: 8px;
        }

        .result-item {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: center;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 7px;
            background: #f6f8fa;
        }

        .result-value {
            min-width: 0;
            word-break: break-all;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 13px;
        }

        .copy-item-btn {
            justify-self: end;
        }

        .hint {
            color: var(--muted-color);
            font-size: 13px;
            line-height: 1.6;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            width: min(650px, calc(100vw - 32px));
            max-height: 85vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            background: #fff;
        }

        .modal-header {
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eaeef2;
            background: #f6f8fa;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 18px;
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            line-height: 1.6;
        }

        .close-modal {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--muted-color);
            cursor: pointer;
            font-size: 20px;
        }

        .changelog-date {
            display: inline-block;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--accent-color);
            font-size: 16px;
            font-weight: 700;
        }

        .changelog-entry {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .changelog-version {
            flex: 0 0 56px;
            color: var(--accent-color);
            font-weight: 700;
        }

        @media (max-width: 860px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="tool-title">
            <h1>UUID / 随机值生成器</h1>
            <div class="version-info" onclick="showChangelog()" title="查看版本更新记录">
                <span>V1.02</span>
                <span>ℹ️</span>
            </div>
        </div>

        <div class="workspace">
            <section class="panel">
                <div class="panel-header">
                    <h2>生成配置</h2>
                </div>
                <div class="form-grid">
                    <label>
                        类型
                        <select id="valueType">
                            <option value="uuid">UUID v4</option>
                            <option value="password">随机密码</option>
                            <option value="number">随机数字</option>
                        </select>
                    </label>
                    <label>
                        数量
                        <input id="countInput" type="number" min="1" max="200" value="10">
                    </label>
                    <label>
                        长度
                        <input id="lengthInput" type="number" min="1" max="256" value="16">
                    </label>
                    <label>
                        最小值
                        <input id="minInput" type="number" value="1">
                    </label>
                    <label>
                        最大值
                        <input id="maxInput" type="number" value="100">
                    </label>
                    <div class="checks">
                        <label><input id="lowerCheck" type="checkbox" checked> 小写</label>
                        <label><input id="upperCheck" type="checkbox" checked> 大写</label>
                        <label><input id="digitsCheck" type="checkbox" checked> 数字</label>
                        <label><input id="symbolsCheck" type="checkbox"> 符号</label>
                    </div>
                    <label>
                        自定义字符集
                        <input id="customCharset" placeholder="留空则使用上方字符集">
                    </label>
                </div>
                <div class="actions">
                    <button class="btn btn-primary" id="generateBtn" type="button">生成</button>
                    <button class="btn btn-danger" id="clearBtn" type="button">清空</button>
                </div>
            </section>

            <section class="panel">
                <div class="result-header">
                    <h2>生成结果</h2>
                    <button class="btn" id="copyAllBtn" type="button">复制全部</button>
                </div>
                <div class="result-list" id="resultList">
                    <div class="hint">点击生成后会在这里显示结果，每一项都可以单独复制。</div>
                </div>
            </section>
        </div>
    </main>

    <div id="changelog-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🚀 版本更新说明</h3>
                <button class="close-modal" type="button" onclick="closeChangelog()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="changelog-date">2026年7月23日</div>
                <div class="changelog-entry">
                    <div class="changelog-version">V1.02</div>
                    <div>将标签、输入框和下拉框样式限定在生成配置表单内，避免影响自定义顶部导航弹窗的工具名称与控件样式。</div>
                </div>
                <div class="changelog-date">2026年7月14日</div>
                <div class="changelog-entry">
                    <div class="changelog-version">V1.01</div>
                    <div>修复随机密码包含特殊字符时结果被误解析为 HTML，导致单项复制按钮错位的问题。</div>
                </div>
                <div class="changelog-date">2026年7月11日</div>
                <div class="changelog-entry">
                    <div class="changelog-version">V1.00</div>
                    <div>版本初始化：支持 UUID v4、随机密码和随机数字生成，可配置数量、长度、字符集，并支持单项和全部复制。</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const resultList = document.getElementById('resultList');
        const valueType = document.getElementById('valueType');
        const symbolsCheck = document.getElementById('symbolsCheck');
        let currentResults = [];

        function getOptions() {
            const customCharset = document.getElementById('customCharset').value;
            const selectedType = valueType.value;
            return {
                type: selectedType,
                count: Number(document.getElementById('countInput').value),
                length: Number(document.getElementById('lengthInput').value),
                min: Number(document.getElementById('minInput').value),
                max: Number(document.getElementById('maxInput').value),
                lower: document.getElementById('lowerCheck').checked,
                upper: document.getElementById('upperCheck').checked,
                digits: document.getElementById('digitsCheck').checked,
                symbols: symbolsCheck.checked,
                charset: customCharset || undefined,
            };
        }

        function createResultItem(value, index) {
            const item = document.createElement('article');
            item.className = 'result-item';

            const valueElement = document.createElement('div');
            valueElement.className = 'result-value';
            valueElement.textContent = value;

            const copyButton = document.createElement('button');
            copyButton.className = 'btn copy-item-btn';
            copyButton.type = 'button';
            copyButton.dataset.index = String(index);
            copyButton.textContent = '复制';

            item.append(valueElement, copyButton);
            return item;
        }

        function renderResults(results) {
            currentResults = results;
            if (!results.length) {
                const hint = document.createElement('div');
                hint.className = 'hint';
                hint.textContent = '暂无生成结果。';
                resultList.replaceChildren(hint);
                return;
            }
            resultList.replaceChildren(...results.map(createResultItem));
        }

        function generateValues() {
            try {
                renderResults(RandomGenerator.generateBatch(getOptions()));
                ClipboardUtils.showToast('随机值已生成');
            } catch (error) {
                ClipboardUtils.showToast(`生成失败：${error.message}`);
            }
        }

        function syncTypeDefaults() {
            if (valueType.value === 'password') {
                symbolsCheck.checked = true;
            }
        }

        document.getElementById('generateBtn').addEventListener('click', generateValues);
        document.getElementById('clearBtn').addEventListener('click', () => renderResults([]));
        valueType.addEventListener('change', syncTypeDefaults);
        document.getElementById('copyAllBtn').addEventListener('click', () => {
            if (!currentResults.length) {
                ClipboardUtils.showToast('暂无生成结果');
                return;
            }
            ClipboardUtils.copyText(currentResults.join('\n'), { successMessage: '全部结果已复制' });
        });
        resultList.addEventListener('click', (event) => {
            const button = event.target.closest('.copy-item-btn');
            if (!button) return;
            ClipboardUtils.copyText(currentResults[Number(button.dataset.index)], { successMessage: '单项结果已复制' });
        });
        syncTypeDefaults();
        generateValues();
    </script>
</body>

</html>
