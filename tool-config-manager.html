<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具配置管理</title>
    <link rel="stylesheet" href="nav.css">
    <script src="nav.js" defer></script>
    <script src="changelog.js"></script>
    <script src="clipboard-utils.js"></script>
    <script src="tool-config-manager.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --panel-bg: #ffffff;
            --border-color: #d0d7de;
            --text-color: #24292f;
            --muted-color: #57606a;
            --accent-color: #0969da;
            --danger-color: #cf222e;
            --code-bg: #f6f8fa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 18px;
            min-height: 100vh;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        button,
        textarea {
            font: inherit;
        }

        .container {
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
        }

        .tool-title,
        .panel-header,
        .actions,
        .config-row {
            display: flex;
            align-items: center;
        }

        .tool-title {
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .version-info {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background: #f6f8fa;
            color: var(--muted-color);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }

        .version-info:hover {
            color: var(--accent-color);
            border-color: var(--accent-color);
            background: #ddf4ff;
        }

        .workspace {
            display: grid;
            grid-template-columns: minmax(360px, 0.8fr) minmax(520px, 1.2fr);
            gap: 16px;
        }

        .panel {
            min-width: 0;
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--panel-bg);
            box-shadow: 0 1px 3px rgba(27, 31, 36, 0.06);
        }

        .panel-header {
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .panel-header h2 {
            margin: 0;
            font-size: 16px;
        }

        .config-list {
            display: grid;
            gap: 10px;
        }

        .config-row {
            justify-content: space-between;
            gap: 12px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--code-bg);
        }

        .config-name {
            font-weight: 700;
        }

        .config-meta {
            margin-top: 4px;
            color: var(--muted-color);
            font-size: 12px;
            line-height: 1.45;
        }

        .badge {
            flex: 0 0 auto;
            padding: 4px 8px;
            border-radius: 999px;
            background: #ddf4ff;
            color: var(--accent-color);
            font-size: 12px;
            font-weight: 700;
        }

        textarea {
            width: 100%;
            min-height: 390px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            background: #fff;
            resize: vertical;
            line-height: 1.55;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 13px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(9, 105, 218, 0.2);
        }

        .actions {
            justify-content: center;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 13px;
            border: 1px solid rgba(27, 31, 36, 0.15);
            border-radius: 6px;
            background: #fff;
            color: var(--text-color);
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover {
            background: #f3f4f6;
        }

        .btn-primary {
            border-color: var(--accent-color);
            background: var(--accent-color);
            color: #fff;
        }

        .btn-danger {
            border-color: var(--danger-color);
            color: var(--danger-color);
        }

        .status {
            margin-top: 12px;
            color: var(--muted-color);
            font-size: 13px;
            line-height: 1.5;
        }

        .status.error {
            color: var(--danger-color);
            font-weight: 700;
        }

        @media (max-width: 900px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="tool-title">
            <h1>工具配置管理</h1>
            <div class="version-info" onclick="showChangelog()" title="查看版本更新说明">
                <span>V1.00</span>
                <span>ℹ️</span>
            </div>
        </div>

        <section class="workspace">
            <div class="panel">
                <div class="panel-header">
                    <h2>可管理配置</h2>
                    <button class="btn" id="refresh-config-btn">刷新</button>
                </div>
                <div class="config-list" id="config-list"></div>
                <div class="status">当前先统一管理已使用本地存储的配置。后续工具增加配置时，只需要在公共注册表里追加一项。</div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2>导入 / 导出 JSON</h2>
                    <button class="btn btn-danger" id="clear-config-btn">清空文本</button>
                </div>
                <textarea id="config-json" spellcheck="false" placeholder="点击导出后会生成配置 JSON；也可以粘贴配置 JSON 后点击导入。"></textarea>
                <div class="actions">
                    <button class="btn btn-primary" id="export-config-btn">导出当前配置</button>
                    <button class="btn" id="copy-config-btn">复制配置 JSON</button>
                    <button class="btn btn-primary" id="import-config-btn">导入配置</button>
                </div>
                <div class="status" id="config-status"></div>
            </div>
        </section>
    </main>

    <div id="changelog-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🚀 版本更新说明</h3>
                <span class="close" onclick="hideChangelog()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="changelog-entry">
                    <div class="changelog-date">2026年7月11日</div>
                    <div class="changelog-item">
                        <div class="changelog-version">V1.00</div>
                        <div class="changelog-description">版本初始化：新增工具本地配置统一导入导出，首批支持文本转义变量映射配置。</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const configList = document.getElementById('config-list');
        const configJson = document.getElementById('config-json');
        const configStatus = document.getElementById('config-status');

        function setStatus(message, isError = false) {
            configStatus.textContent = message;
            configStatus.classList.toggle('error', isError);
        }

        function copyText(text) {
            if (window.ClipboardUtils && ClipboardUtils.copyText) {
                ClipboardUtils.copyText(text);
                return;
            }
            navigator.clipboard.writeText(text);
        }

        function renderConfigList() {
            const payload = ToolConfigManager.createExportPayload();
            const activeKeys = new Set(payload.configs.map((item) => item.storageKey));
            configList.innerHTML = ToolConfigManager.getRegistry().map((entry) => `
                <div class="config-row">
                    <div>
                        <div class="config-name">${entry.name}</div>
                        <div class="config-meta">${entry.tool} · ${entry.storageKey}</div>
                        <div class="config-meta">${entry.description}</div>
                    </div>
                    <span class="badge">${activeKeys.has(entry.storageKey) ? '有配置' : '未配置'}</span>
                </div>
            `).join('');
        }

        document.getElementById('export-config-btn').addEventListener('click', () => {
            try {
                const payload = ToolConfigManager.createExportPayload();
                configJson.value = JSON.stringify(payload, null, 2);
                setStatus(`已导出 ${payload.configs.length} 项配置。`);
                renderConfigList();
            } catch (error) {
                setStatus(error.message, true);
            }
        });

        document.getElementById('import-config-btn').addEventListener('click', () => {
            try {
                const payload = JSON.parse(configJson.value);
                const result = ToolConfigManager.importConfigPayload(payload);
                setStatus(`已导入 ${result.imported} 项配置，跳过 ${result.skipped} 项未知配置。`);
                renderConfigList();
            } catch (error) {
                setStatus(`导入失败：${error.message}`, true);
            }
        });

        document.getElementById('copy-config-btn').addEventListener('click', () => copyText(configJson.value));
        document.getElementById('clear-config-btn').addEventListener('click', () => {
            configJson.value = '';
            setStatus('');
        });
        document.getElementById('refresh-config-btn').addEventListener('click', () => {
            renderConfigList();
            setStatus('配置状态已刷新。');
        });

        renderConfigList();
    </script>
</body>

</html>
